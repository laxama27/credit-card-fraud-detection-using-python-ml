<!DOCTYPE html>
<html>
<head>
    <title>Fraud Detection</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.08);
            padding: 60px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease;
            width: 400px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 25px;
        }

        .features {
            margin-bottom: 25px;
        }

        .features p {
            margin: 6px 0;
            font-size: 14px;
        }

        input {
            padding: 12px;
            width: 90%;
            border-radius: 20px;
            border: none;
            margin-bottom: 12px;
            text-align: center;
            background: rgba(255,255,255,0.15);
            color: white;
        }

        input::placeholder {
            color: #ddd;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(79,172,254,0.8);
        }

        /* 🚀 PRIMARY BUTTON (AI BLUE) */
        button {
            padding: 15px 35px;
            font-size: 16px;
            background: linear-gradient(135deg, #4facfe, #00c9a7);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(79,172,254,0.8);
        }

        /* 🆕 SECONDARY BUTTON */
        .signup-btn {
            margin-top: 10px;
            background: linear-gradient(135deg, #5f9cff, #6a82fb);
        }

        .signup-btn:hover {
            box-shadow: 0 0 20px rgba(106,130,251,0.8);
        }

        /* ❌ ERROR (FRAUD ALERT STYLE) */
        .error {
            color: #ff4d6d;
            margin-top: 10px;
            font-weight: bold;
        }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #bbb;
            font-size: 14px;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .link a {
            color: #00c9a7;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>💳 Fraud Detection System</h1>

        <p class="subtitle">
            Smart AI system for secure transaction analysis
        </p>

        <div class="features">
            <p>⚡ Fast Detection</p>
            <p>🔐 Secure Analysis</p>
            <p>📊 Real-time Results</p>
        </div>

        <!-- ✅ LOGIN -->
        
        <form method="POST">
            <input type="text" name="username" placeholder="👤 Username" required>
            <input type="password" name="password" placeholder="🔒 Password" required>
            <button type="submit">🚀 Start Detection</button>
        </form>

        <!-- ✅ SIGNUP BUTTON -->
        <a href="/signup">
            <button class="signup-btn">🆕 Create Account</button>
        </a>

        <!-- OPTIONAL TEXT LINK -->
        <div class="link">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <footer>
        <p>Developed by Laxmi | AI Project</p>
    </footer>

</body>
</html>
